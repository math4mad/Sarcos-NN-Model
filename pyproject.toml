[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcos-svd"
version = "0.1.0"
description = "SVD probe of what a small MLP learns on the SARCOS robot-arm inverse-dynamics task"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
