project:
  type: website
  output-dir: docs          # git-ignored; published by the quarto-publish workflow
  preview:
    port: 4200
  render:
    - index.qmd
    - notes/results.qmd

website:
  title: "SARCOS × SVD"
  # GitHub Pages project sites are served under /<repo>/, so every absolute link
  # has to be prefixed; without this the stylesheet and figure paths 404.
  site-url: https://math4mad.github.io/Sarcos-NN-Model/
  repo-url: https://github.com/math4mad/Sarcos-NN-Model
  repo-branch: gh-pages
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: notes/results.qmd
        text: Results note
    right:
      - icon: github
        href: https://github.com/math4mad/Sarcos-NN-Model
  page-footer:
    left: "© 2026 math4mad — dual-licensed MIT OR Apache-2.0"
    right: "SARCOS data © Rasmussen & Williams; not redistributed here."

format:
  html:
    theme: cosmo
    number-sections: true
    toc-title: Contents
    fig-align: center
    code-overflow: wrap
